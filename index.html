<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ticket de la compra</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
	<main>
		<h1>Ticket de compra</h1>
		<p>Introduce un concepto y su importe para ir construyendo el ticket de la compra.</p>

		<section class="formulario">
			<div class="campo campo-concepto">
				<label for="concepto">Concepto</label>
				<input id="concepto" type="text" placeholder="Ejemplo: Pan">
			</div>

			<div class="campo campo-importe">
				<label for="importe">Importe</label>
				<input id="importe" type="number" step="0.01" placeholder="Ejemplo: 1.25">
			</div>

			<div class="campo acciones">
				<label>Acciones</label>
				<div class="grupo-botones">
					<button id="btn-anadir" type="button">Añadir</button>
					<button id="btn-reset" class="secundario" type="button">Reset</button>
				</div>
			</div>
		</section>

		<section class="resultado">
			<h2>Lista de la compra</h2>
			<div id="lista" class="lista">
				<p class="vacio">Todavía no hay conceptos añadidos.</p>
			</div>
			<h2 class="total">Total: <span id="total">0</span></h2>
		</section>
	</main>

	<script src="app.js"></script>
</body>
</html>
