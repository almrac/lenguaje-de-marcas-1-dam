<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200" role="img" aria-labelledby="titulo descripcion">
	<title id="titulo">Sin producto seleccionado</title>
	<desc id="descripcion">Imagen de marcador de posicion cuando no hay producto seleccionado.</desc>
	<rect width="200" height="200" rx="18" fill="#e2e8f0"/>
